<!DOCTYPE html>
<html>
<head>
<title>ASTRA V4 Command Center</title>
<style>
body{font-family:Arial;background:#0b1220;color:#fff;padding:30px}
.card{background:#162033;border-radius:12px;padding:20px;margin:15px 0}
.status{color:#4ade80}
table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #334155}
</style>
</head>
<body>
<h1>ASTRA V4 Command Center</h1>
<div class="card">
<h2>Engine Status</h2>
<div class="status">ONLINE</div>
<p>Runtime Analyzer: OK</p>
<p>Recommendation Engine: OK</p>
</div>
<div class="card">
<h2>Latest Recommendations</h2>
<table>
<tr><th>Symbol</th><th>Signal</th><th>Entry</th><th>Target</th><th>Stop</th><th>Confidence</th></tr>
<tr><td colspan="6">Waiting for API data connection</td></tr>
</table>
</div>
</body>
</html>
