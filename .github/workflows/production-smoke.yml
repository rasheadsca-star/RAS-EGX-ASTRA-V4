name: ASTRA Production Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production endpoints
        shell: bash
        run: |
          set +e
          hosts=(
            "https://ras-egx-astra-v4-8nvrp022c-rasheed18.vercel.app"
            "https://ras-egx-astra-v4.vercel.app"
            "https://ras-egx-astra-v4-live.vercel.app"
          )

          valid_json=0

          for base in "${hosts[@]}"; do
            echo
            echo "=============================="
            echo "HOST: $base"
            echo "=============================="

            for path in "/api/recommendations" "/api/data-health" "/api/system-health"; do
              echo "--- $path"
              tmp_headers="$(mktemp)"
              tmp_body="$(mktemp)"

              code="$(curl -sS -L --max-time 20 --retry 1 -D "$tmp_headers" -o "$tmp_body" -w '%{http_code}' "$base$path?probe=$(date +%s)" 2>&1)"
              rc=$?

              echo "curl_exit=$rc http_status=$code"
              echo "content_type=$(grep -i '^content-type:' "$tmp_headers" | tail -1 | tr -d '')"
              echo "location=$(grep -i '^location:' "$tmp_headers" | tail -1 | tr -d '')"
              echo "body_preview:"
              head -c 1500 "$tmp_body" | sed 's/[^[:print:]	]/?/g'
              echo

              if python - "$tmp_body" <<'PY'
import json,sys
try:
    x=json.load(open(sys.argv[1]))
    assert isinstance(x,dict)
    print("VALID_JSON_OBJECT")
    raise SystemExit(0)
except Exception:
    raise SystemExit(1)
PY
              then
                valid_json=1
              fi

              rm -f "$tmp_headers" "$tmp_body"
            done
          done

          echo
          echo "valid_json_detected=$valid_json"

          if [ "$valid_json" -ne 1 ]; then
            echo "No tested production hostname returned a JSON API response."
            exit 2
          fi
