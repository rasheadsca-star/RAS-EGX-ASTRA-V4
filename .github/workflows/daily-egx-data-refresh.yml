# Canonical EGX refresh: mirrors the validated post-market PRO dataset into V4.
name: Daily EGX Data Refresh

on:
  schedule:
    # Run after the canonical PRO post-market refresh has normally completed.
    # Use Cairo timezone so DST changes do not move the intended local time.
    - cron: '30 22 * * 0-4'
      timezone: 'Africa/Cairo'
  workflow_dispatch:
  # One-time immediate validation when this workflow definition is changed.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-egx-data-refresh.yml'

concurrency:
  group: astra-v4-daily-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh canonical market and history stores
        run: npm run data:refresh

      - name: Validate generated stores
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('data/canonical-market.json'));const h=JSON.parse(fs.readFileSync('data/history-index.json'));if(!Array.isArray(m.rows)||m.rows.length<80)throw new Error('Canonical market coverage too low');if(!h.coverage||h.coverage.coveragePct<80)throw new Error('History coverage below 80%');console.log({marketRows:m.rows.length,historyCoveragePct:h.coverage.coveragePct,expectedSession:m.source.expectedSession});"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/canonical-market.json data/history-index.json
          if git diff --cached --quiet; then
            echo "No canonical data changes."
          else
            git commit -m "chore(data): refresh canonical EGX market store"
            git push
          fi
