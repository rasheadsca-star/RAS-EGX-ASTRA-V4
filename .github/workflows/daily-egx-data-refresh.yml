name: Daily EGX Data Refresh

on:
  schedule:
    # 16:30 Africa/Cairo is 13:30 UTC during Egypt daylight time; run after the EGX session.
    - cron: '30 13 * * 0-4'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh historical/session data
        run: |
          if npm run | grep -q "data:refresh"; then
            npm run data:refresh
          elif npm run | grep -q "refresh:data"; then
            npm run refresh:data
          else
            echo "No data refresh script is defined yet; workflow stops safely."
            exit 0
          fi

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ backups/ || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh daily EGX market data"
            git push
          fi
