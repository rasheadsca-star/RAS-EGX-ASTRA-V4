name: UCP Real Morning Evidence Collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ucp-morning-evidence.yml"
      - "scripts/ucp-morning-evidence-collector.js"
  schedule:
    # Covers Africa/Cairo UTC+2 and UTC+3. Runtime preflight accepts only 10:20-10:45 Cairo.
    - cron: "20,30,40,45 7-8 * * 0-4"

permissions:
  contents: write

concurrency:
  group: ucp-real-morning-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect fail-closed morning evidence
        run: node scripts/ucp-morning-evidence-collector.js

      - name: Validate evidence JSON
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='data/ucp/morning-evidence.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.schemaVersion!=='rasheed-egx-ucp-morning-evidence/v1') throw new Error('MORNING_EVIDENCE_SCHEMA_MISMATCH');
          if(x.completeSource===true){
            if(!(Number(x.marketCoveragePct)>=90)) throw new Error('COMPLETE_MORNING_EVIDENCE_LOW_COVERAGE');
            for(const [ticker,e] of Object.entries(x.evidenceByTicker||{})){
              if(e.candidatePresent!==true||e.volumeBaselineAvailable!==true) throw new Error(`COMPLETE_EVIDENCE_NOT_READY:${ticker}`);
              for(const key of ['openingGapPass','priceAcceptancePass','relativeVolumePass','relativeTurnoverPass','marketBreadthPass']){
                if(typeof e[key]!=='boolean') throw new Error(`COMPLETE_EVIDENCE_CHECK_MISSING:${ticker}:${key}`);
              }
            }
          }
          console.log(JSON.stringify({sessionDate:x.sessionDate,completeSource:x.completeSource,coverage:x.marketCoveragePct,candidates:Object.keys(x.evidenceByTicker||{}).length}));
          NODE

      - name: Commit prospective morning evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/ucp/morning-evidence.json; then
            echo "No morning evidence change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ucp/morning-evidence.json
          git commit -m "chore(ucp): capture real morning evidence"
          for attempt in 1 2 3; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
            [ "$attempt" = "3" ] && exit 1
            sleep $((attempt * 8))
          done
