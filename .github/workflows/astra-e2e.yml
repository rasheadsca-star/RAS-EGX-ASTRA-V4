name: ASTRA E2E Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  astra-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build check
        run: npm run build

      - name: Runtime validation
        run: npm test

      - name: Full ASTRA E2E validation
        run: node scripts/astra-e2e-runner.js

      - name: Production contract validation
        shell: bash
        env:
          ASTRA_PROD_URL: https://ras-egx-astra-v4.vercel.app
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          curl -fsSL --retry 3 --retry-delay 2 --max-time 30             "$ASTRA_PROD_URL/api/recommendations?ci=$GITHUB_SHA" > "$body"

          python - "$body" "$GITHUB_SHA" <<'PY'
import json, sys

path, expected_commit = sys.argv[1], sys.argv[2]
with open(path, encoding="utf-8") as f:
    data = json.load(f)

assert data.get("success") is True, data
assert data.get("market") == "EGX", data
assert data.get("status") in {"LIVE_READY", "HISTORICAL_READY"}, data
assert isinstance(data.get("recommendations"), list), data
assert data.get("count", 0) > 0, data

deployment_commit = data.get("deploymentCommit")
assert deployment_commit, "Production did not expose VERCEL_GIT_COMMIT_SHA"
assert deployment_commit == expected_commit, {
    "expected_commit": expected_commit,
    "deployment_commit": deployment_commit
}

print(json.dumps({
    "production_status": data.get("status"),
    "mode": data.get("mode"),
    "dataSource": data.get("dataSource"),
    "count": data.get("count"),
    "symbolsAnalyzed": data.get("symbolsAnalyzed"),
    "deploymentCommit": deployment_commit
}, indent=2))
PY

      - name: Upload ASTRA Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-result
          path: artifacts/astra-result.json
