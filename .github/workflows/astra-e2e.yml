name: ASTRA E2E Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  astra-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run ASTRA Pipeline Test
        run: |
          node engine/pipeline/e2e-pipeline-test.js

      - name: Generate ASTRA Signal Output
        run: |
          node scripts/astra-e2e-runner.js

      - name: Upload ASTRA Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-result
          path: artifacts/astra-result.json
