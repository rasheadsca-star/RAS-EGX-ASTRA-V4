name: ASTRA E2E Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  astra-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build check
        run: npm run build

      - name: Runtime validation
        run: npm test

      - name: Full ASTRA E2E validation
        run: node scripts/astra-e2e-runner.js

      - name: Production endpoint probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          for base in \
            "https://ras-egx-astra-v4-8nvrp022c-rasheed18.vercel.app" \
            "https://ras-egx-astra-v4.vercel.app" \
            "https://ras-egx-astra-v4-live.vercel.app"
          do
            echo
            echo "===== $base ====="
            for path in "/api/recommendations" "/api/data-health" "/api/system-health"
            do
              echo "--- $path"
              curl -sS -L --max-time 20 --retry 1 -D - "$base$path?probe=$(date +%s)" | head -c 2500
              echo
              echo "-----"
            done
          done

      - name: Upload ASTRA Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-result
          path: artifacts/astra-result.json
